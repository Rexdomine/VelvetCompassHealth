services:
  - type: web
    name: velvet-compass-health
    env: node
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: velvetcompasshealth.com
      - key: DB_PATH
        value: /var/data/app.db
    disk:
      name: velvet-compass-data
      mountPath: /var/data
      sizeGB: 1
