services:
  - type: web
    name: velvet-compass-health
    env: node
    branch: codex/vch-live-visual-review-2026-11-03
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: velvetcompasshealth.com
      - key: DB_PATH
        value: /var/data/app.db
      - key: ADMIN_EMAIL
        value: office@velvetcompasshealth.com
      - key: BREVO_SENDER_NAME
        value: Velvet Compass Health
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
    disk:
      name: velvet-compass-data
      mountPath: /var/data
      sizeGB: 1
